name: v1.17.1 Semantic Follow-Up

on:
  push:
    branches: [fix/v1.17.1-stabilization]

permissions:
  contents: write

jobs:
  verify-followup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: fix/v1.17.1-stabilization

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Apply construction-aware UI follow-up
        run: python .github/scripts/apply_v1_17_1_followup.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck, unit tests and build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Chromium regression gate
        run: npm run test:e2e

      - name: Commit validated follow-up
        run: |
          rm -rf test-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v1.17.1-followup.yml .github/scripts/apply_v1_17_1_followup.py
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Align construction-aware topology UI"
          git push origin HEAD:fix/v1.17.1-stabilization
