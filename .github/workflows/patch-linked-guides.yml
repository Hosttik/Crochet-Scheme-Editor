name: Patch linked guides editor shell

on:
  push:
    branches:
      - feature/linked-guides-v111

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/linked-guides-v111
      - name: Apply editor integration patch
        run: python scripts/patch_linked_guides.py
      - name: Remove one-shot patch helpers
        run: rm .github/workflows/patch-linked-guides.yml scripts/patch_linked_guides.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate linked guides into editor UX"
          git push origin HEAD:feature/linked-guides-v111
