name: UI v2 direct workbench migration fix

on:
  push:
    branches:
      - feat/ui-v2-workbench-foundation
    paths:
      - .github/workflows/ui-v2-direct-workbench-fix.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/ui-v2-workbench-foundation
          fetch-depth: 0
      - name: Apply direct workbench migration
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, got {count}')
              return text.replace(old, new, 1)

          app_path = Path('src/App.tsx')
          app = app_path.read_text()
          app = once(
              app,
              "import { EditorShell } from './ui/EditorShell'\nimport type { WorkbenchCommands, WorkbenchTool } from './ui/workbenchTypes'\n",
              "import { EditorShell } from './ui/EditorShell'\nimport { FavoriteQuickBar } from './ui/FavoriteQuickBar'\nimport { loadFavorites, saveFavorites, type FavoriteElementKey } from './ui/favorites'\nimport { LeftWorkbenchSurface } from './ui/LeftWorkbenchSurface'\nimport type { WorkbenchTool } from './ui/workbenchTypes'\n",
              'workbench imports',
          )
          app = once(
              app,
              "  const [tool, setTool] = useState<WorkbenchTool>({ type: 'select' })\n",
              "  const [tool, setTool] = useState<WorkbenchTool>({ type: 'select' })\n  const [workbenchQuery, setWorkbenchQuery] = useState('')\n  const [favorites, setFavorites] = useState<FavoriteElementKey[]>(loadFavorites)\n",
              'workbench state',
          )
          app = once(
              app,
              "  useEffect(() => {\n    window.localStorage.setItem(LOCALE_STORAGE_KEY, locale)\n    document.documentElement.lang = locale\n    if (hydrated) setStatus(UI[locale].ready)\n  }, [hydrated, locale])\n\n",
              "  useEffect(() => {\n    window.localStorage.setItem(LOCALE_STORAGE_KEY, locale)\n    document.documentElement.lang = locale\n    if (hydrated) setStatus(UI[locale].ready)\n  }, [hydrated, locale])\n\n  useEffect(() => saveFavorites(favorites), [favorites])\n\n",
              'favorites persistence',
          )

          command_marker = "  const workbenchCommands = useMemo<WorkbenchCommands>(() => ({"
          if app.count(command_marker) != 1:
              raise RuntimeError('workbench command marker changed')
          toggle_favorite = (
              "  const toggleFavorite = useCallback((key: FavoriteElementKey) => {\n"
              "    setFavorites((current) => current.includes(key)\n"
              "      ? current.filter((favorite) => favorite !== key)\n"
              "      : [...current, key])\n"
              "  }, [])\n\n"
          )
          app = app.replace(command_marker, toggle_favorite + command_marker, 1)
          start = app.index(command_marker)
          end_marker = "  const updateSelectedGuide"
          end = app.index(end_marker, start)
          app = app[:start] + app[end:]

          app = once(
              app,
              "    <EditorShell locale={locale} workbenchCommands={workbenchCommands} workbenchTool={tool}>",
              "    <EditorShell locale={locale}>",
              'EditorShell props',
          )
          app = once(
              app,
              "        <div className=\"topbar-actions\">\n          <span className={`autosave-indicator ${autosaveState}`}>{autosaveLabel}</span>",
              "        <div className=\"topbar-actions\">\n          <div className=\"ui-v2-favorites-host\">\n            <FavoriteQuickBar\n              locale={locale}\n              tool={tool}\n              favorites={favorites}\n              onSelectSymbol={selectWorkbenchSymbol}\n              onSelectChainBundle={selectWorkbenchChainBundle}\n              onCancelPlacement={selectWorkbenchTool}\n            />\n          </div>\n          <span className={`autosave-indicator ${autosaveState}`}>{autosaveLabel}</span>",
              'direct quick favorites',
          )
          app = once(
              app,
              "      <aside className=\"sidebar left-sidebar\">\n\n        <ProjectManagerPanel",
              "      <aside className=\"sidebar left-sidebar\">\n        <LeftWorkbenchSurface\n          locale={locale}\n          tool={tool}\n          query={workbenchQuery}\n          favorites={favorites}\n          onSelect={selectWorkbenchTool}\n          onTogglePan={togglePanWorkbenchTool}\n          onToggleLasso={toggleLassoWorkbenchTool}\n          onAddGuide={addGuide}\n          onToggleRuler={toggleRulerTool}\n          onQueryChange={setWorkbenchQuery}\n          onToggleFavorite={toggleFavorite}\n          onSelectSymbol={selectWorkbenchSymbol}\n          onSelectChainBundle={selectWorkbenchChainBundle}\n          onCancelPlacement={selectWorkbenchTool}\n        />\n\n        <ProjectManagerPanel",
              'direct left surface',
          )
          if 'workbenchCommands' in app or 'WorkbenchCommands' in app:
              raise RuntimeError('obsolete workbench command bundle remains')
          app_path.write_text(app)

          editor_shell = """import type { ReactNode } from 'react'
import type { Locale } from '../i18n'
import { AppMenuBar } from './AppMenuBar'
import type { ApplicationCommandRunner } from './applicationCommands'
import { CommandPalette } from './CommandPalette'
import { RightInspectorBridge } from './RightInspectorBridge'
import './editor-shell.css'

export type EditorShellProps = {
  children: ReactNode
  locale?: Locale
  runCommand?: ApplicationCommandRunner
}

export function EditorShell({ children, locale, runCommand }: EditorShellProps) {
  return (
    <div className="editor-root-v2">
      <AppMenuBar locale={locale} runCommand={runCommand} />
      <CommandPalette locale={locale} runCommand={runCommand} />
      <div className="editor-root-v2__workbench">
        {children}
        <RightInspectorBridge locale={locale} />
      </div>
    </div>
  )
}
"""
          Path('src/ui/EditorShell.tsx').write_text(editor_shell)

          structure_path = Path('src/ui/workbench-structure.css')
          structure = structure_path.read_text()
          legacy_css = """
.ui-v2-left-bridge-host {
  display: contents;
}

/* Legacy duplicates remain mounted only as a behavioral compatibility layer. */
.left-sidebar > [data-ui-v2-legacy-tools="true"],
.left-sidebar > [data-ui-v2-legacy-library="true"],
.left-sidebar > .legacy-symbols-section,
.left-sidebar .ui-v2-legacy-guide-add {
  display: none !important;
}
"""
          if legacy_css not in structure:
              raise RuntimeError('legacy bridge CSS block changed')
          structure = structure.replace(legacy_css, '\n', 1)
          structure = structure.replace('.ui-v2-left-bridge-host > .tool-rail', '.left-sidebar > .tool-rail')
          structure = structure.replace('.ui-v2-left-bridge-host > .element-library', '.left-sidebar > .element-library')
          structure = structure.replace('.left-sidebar > .panel-section,\n.ui-v2-left-bridge-host > .panel-section', '.left-sidebar > .panel-section')
          structure = structure.replace(
              ' * the existing left sidebar while App.tsx still owns editor state. Legacy\n * controls stay mounted (and therefore callable during migration) but their\n * duplicate visual copies are hidden. Layers are temporarily reparented into\n',
              ' * the existing left sidebar with App.tsx owning editor state and semantic\n * workbench commands directly. Layers are temporarily reparented into\n',
          )
          if 'ui-v2-left-bridge-host' in structure or 'data-ui-v2-legacy-tools' in structure:
              raise RuntimeError('left bridge CSS remains')
          structure_path.write_text(structure)

          favorites_path = Path('src/ui/favorites.css')
          favorites_css = favorites_path.read_text()
          if 'ui-v2-favorites-bridge-host' not in favorites_css:
              raise RuntimeError('favorite bridge selector missing')
          favorites_path.write_text(favorites_css.replace('ui-v2-favorites-bridge-host', 'ui-v2-favorites-host'))

          for path in Path('e2e').glob('*.ts'):
              text = path.read_text()
              if 'ui-v2-favorites-bridge-host' in text:
                  path.write_text(text.replace('ui-v2-favorites-bridge-host', 'ui-v2-favorites-host'))

          Path('src/ui/LeftWorkbenchBridge.tsx').unlink()
          Path('src/ui/legacyWorkbenchAdapter.ts').unlink()

          for root in (Path('src'), Path('e2e')):
              for path in root.rglob('*'):
                  if not path.is_file():
                      continue
                  text = path.read_text(errors='ignore')
                  if 'LeftWorkbenchBridge' in text or 'legacyWorkbenchAdapter' in text:
                      raise RuntimeError(f'obsolete bridge reference remains in {path}')
          PY
      - name: Remove one-shot workflows
        run: |
          rm .github/workflows/ui-v2-direct-workbench.yml
          rm .github/workflows/ui-v2-direct-workbench-fix.yml
      - name: Validate patch
        run: |
          git diff --check
          grep -q '<LeftWorkbenchSurface' src/App.tsx
          grep -q '<FavoriteQuickBar' src/App.tsx
          ! grep -R 'ui-v2-left-bridge-host\|ui-v2-favorites-bridge-host' src e2e
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Render UI v2 workbench directly from App"
          git push origin HEAD:feat/ui-v2-workbench-foundation
