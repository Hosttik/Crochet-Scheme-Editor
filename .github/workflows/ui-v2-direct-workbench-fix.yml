name: UI v2 direct workbench migration fix

on:
  push:
    branches:
      - feat/ui-v2-workbench-foundation
    paths:
      - .github/workflows/ui-v2-direct-workbench-fix.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/ui-v2-workbench-foundation
          fetch-depth: 0
      - name: Normalize direct-surface documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/ui/LeftWorkbenchSurface.tsx')
          text = path.read_text()
          old = " * semantic callbacks. Once App owns the workbench layout directly this\n * component can be rendered in place and LeftWorkbenchBridge can disappear."
          new = " * semantic callbacks from App. It is rendered directly in the left workbench\n * and does not depend on a portal or compatibility bridge."
          if old not in text:
              raise SystemExit('LeftWorkbenchSurface migration comment changed unexpectedly')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Apply direct workbench migration
        run: python scripts/migrate_ui_v2_direct_workbench.py
      - name: Remove one-shot migration files
        run: |
          rm .github/workflows/ui-v2-direct-workbench.yml
          rm .github/workflows/ui-v2-direct-workbench-fix.yml
          rm scripts/migrate_ui_v2_direct_workbench.py
      - name: Validate patch
        run: |
          git diff --check
          grep -q '<LeftWorkbenchSurface' src/App.tsx
          grep -q '<FavoriteQuickBar' src/App.tsx
          ! grep -R 'ui-v2-left-bridge-host\|ui-v2-favorites-bridge-host' src e2e
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Render UI v2 workbench directly from App"
          git push origin HEAD:feat/ui-v2-workbench-foundation
