name: Apply configurable autosave controls fixed

on:
  push:
    branches:
      - feature/row-boundaries-v113-final
    paths:
      - .github/workflows/apply-autosave-v113-fixed.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/row-boundaries-v113-final
      - name: Apply autosave settings pass
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/apply-autosave.py
          python /tmp/apply-autosave.py
      - name: Commit product changes and remove staging workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-autosave-v113.yml .github/workflows/apply-autosave-v113-fixed.yml
          git add src/App.tsx src/types.ts src/styles.css src/editor/projectSchema.ts src/editor/autosaveSettings.test.ts e2e/autosaveSettings.e2e.ts README.md
          git commit -m "Add configurable autosave settings"
          git push origin HEAD:feature/row-boundaries-v113-final
