name: Apply keyboard router cleanup patch

on:
  push:
    branches:
      - fix/ui-v2-keyboard-router-cleanup

permissions:
  contents: write

jobs:
  patch-sources:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/ui-v2-keyboard-router-cleanup
      - name: Remove legacy shortcut fallbacks
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          function patchFile(path, patch) {
            let source = fs.readFileSync(path, 'utf8')
            const replaceOnce = (needle, replacement, label) => {
              const first = source.indexOf(needle)
              if (first < 0) throw new Error(`${path}: missing patch anchor: ${label}`)
              if (source.indexOf(needle, first + needle.length) >= 0) throw new Error(`${path}: ambiguous patch anchor: ${label}`)
              source = source.slice(0, first) + replacement + source.slice(first + needle.length)
            }
            patch({ replaceOnce, getSource: () => source, setSource: (value) => { source = value } })
            fs.writeFileSync(path, source)
          }

          patchFile('src/App.tsx', ({ replaceOnce }) => {
            replaceOnce(
              '  const duplicateKeyDownRef = useRef(false)\n',
              '',
              'duplicate key ref',
            )

            replaceOnce(
              `\n      if (!editing && (event.key === 'Delete' || event.key === 'Backspace')) {\n        event.preventDefault()\n        deleteSelected()\n      }\n`,
              '',
              'legacy delete shortcut',
            )

            replaceOnce(
              `        } else if (event.key === '0') {\n          event.preventDefault()\n          setCanvasZoom(1)\n        } else if (event.key.toLowerCase() === 'f') {\n          event.preventDefault()\n          if (event.shiftKey) fitSelection()\n          else fitAll()\n        } else if (event.key.toLowerCase() === 's') {\n          event.preventDefault()\n          toggleSnapping()\n        } else if (event.key.toLowerCase() === 'r') {\n          event.preventDefault()\n          toggleRulerTool()\n        } else if (event.key.toLowerCase() === 'l') {\n          event.preventDefault()\n          setTool((current) => current.type === 'lasso' ? { type: 'select' } : { type: 'lasso' })\n          setLasso(null)\n          setPreview(null)\n          setSnapTarget(null)\n          setSelectedGuideId(null)\n          setSelectedRowMarkerId(null)\n        } else if (event.key.toLowerCase() === 'h') {\n          event.preventDefault()\n          setTool((current) => current.type === 'pan' ? { type: 'select' } : { type: 'pan' })\n          setLasso(null)\n          setPreview(null)\n          setSnapTarget(null)\n          setRulerDraft(null)\n        }\n`,
              `        } else if (event.key.toLowerCase() === 's') {\n          event.preventDefault()\n          toggleSnapping()\n        }\n`,
              'legacy fit/tool shortcuts',
            )

            replaceOnce(
              `\n      if (!editing && (event.metaKey || event.ctrlKey)) {\n        const key = event.key.toLowerCase()\n        if (key === 'z') {\n          event.preventDefault()\n          if (event.shiftKey) redo()\n          else undo()\n        } else if (key === 'c') {\n          event.preventDefault()\n          copySelection()\n        } else if (key === 'v') {\n          event.preventDefault()\n          pasteSelection()\n        } else if (key === 'd') {\n          event.preventDefault()\n          if (!event.repeat && !duplicateKeyDownRef.current) {\n            duplicateKeyDownRef.current = true\n            duplicateSelection()\n          }\n        } else if (key === 'a') {\n          event.preventDefault()\n          selectAll()\n        }\n      }\n`,
              '',
              'legacy command modifier shortcuts',
            )

            replaceOnce(
              `\n      if (event.key.toLowerCase() === 'd' || event.key === 'Control' || event.key === 'Meta') {\n        duplicateKeyDownRef.current = false\n      }`,
              '',
              'legacy duplicate keyup reset',
            )

            replaceOnce(
              `  }, [\n    copySelection,\n    deleteSelected,\n    drag,\n    duplicateSelection,\n    fitAll,\n    fitSelection,\n    nudgeSelection,\n    pasteSelection,\n    redo,\n    rotate,\n    rulerDrag,\n    selectAll,\n    setCanvasZoom,\n    toggleRulerTool,\n    toggleSnapping,\n    undo,\n    zoomCanvas,\n  ])`,
              `  }, [\n    drag,\n    nudgeSelection,\n    rotate,\n    rulerDrag,\n    toggleSnapping,\n    zoomCanvas,\n  ])`,
              'keyboard effect dependencies',
            )
          })

          patchFile('src/ui/AppMenuBar.tsx', ({ replaceOnce }) => {
            replaceOnce(
              "        { label: 'Привязка', command: 'settings.snapping', shortcut: 'S' },",
              "        { label: 'Привязка', command: 'settings.snapping' },",
              'Russian snapping shortcut label',
            )
            replaceOnce(
              "        { label: 'Snapping', command: 'settings.snapping', shortcut: 'S' },",
              "        { label: 'Snapping', command: 'settings.snapping' },",
              'English snapping shortcut label',
            )
            replaceOnce(
              "    case 'settings.snapping': return 'S'\n",
              '',
              'snapping aria shortcut',
            )
          })

          patchFile('src/ui/ApplicationCommandShortcuts.tsx', ({ replaceOnce }) => {
            replaceOnce(
              `      // Keep normal text editing/browser behavior, but do not let the legacy\n      // App-level window listener execute an editor command behind that UI.`,
              `      // Keep normal text editing/browser behavior and isolate application\n      // commands from UI surfaces that own the same keyboard event.`,
              'application shortcut scope comment',
            )
          })

          patchFile('src/ui/WorkbenchToolShortcuts.tsx', ({ replaceOnce }) => {
            replaceOnce(
              `      // Menus/dialogs own plain-letter keyboard input while focused. Consume\n      // the tool shortcut here so the legacy App window listener cannot see it\n      // and activate a canvas tool behind the UI surface.`,
              `      // Menus/dialogs own plain-letter keyboard input while focused. Keep\n      // canvas tool shortcuts isolated from those UI surfaces.`,
              'tool UI-scope comment',
            )
            replaceOnce(
              `      // App owns the state transition; this layer only routes the same keyboard\n      // commands used by expert workflows into the semantic callbacks already\n      // shared by ToolRail and CanvasToolbar. Stopping at document prevents the\n      // legacy App-level fallback listener on window from executing a second,\n      // divergent transition.`,
              `      // App owns the state transition; this layer routes expert-workflow\n      // shortcuts into the semantic callbacks shared by ToolRail and CanvasToolbar.`,
              'tool router comment',
            )
          })
          NODE
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet -- src/App.tsx src/ui/AppMenuBar.tsx src/ui/ApplicationCommandShortcuts.tsx src/ui/WorkbenchToolShortcuts.tsx; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/ui/AppMenuBar.tsx src/ui/ApplicationCommandShortcuts.tsx src/ui/WorkbenchToolShortcuts.tsx
          git commit -m 'Remove legacy App keyboard shortcut fallbacks'
          git push origin HEAD:fix/ui-v2-keyboard-router-cleanup
