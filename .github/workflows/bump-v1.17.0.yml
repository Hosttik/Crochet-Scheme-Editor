name: Bump package version v1.17.0

on:
  push:
    branches:
      - release/v1.17.0
    paths:
      - .github/workflows/bump-v1.17.0.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/v1.17.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm version 1.17.0 --no-git-tag-version
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Commit package metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Bump package version to 1.17.0"
          git push origin HEAD:release/v1.17.0
