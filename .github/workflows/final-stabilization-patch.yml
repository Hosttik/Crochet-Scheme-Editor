name: Apply final stabilization migration

on:
  push:
    branches: [stabilization/v1.15.1-data-integrity]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: stabilization/v1.15.1-data-integrity
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Apply migration
        run: |
          python scripts/apply_final_stabilization.py
          python scripts/final_stabilization_testfix.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify typecheck, unit tests and build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Verify Chromium E2E
        run: npm run test:e2e
      - name: Commit verified sources
        run: |
          git restore --source=HEAD -- .github/workflows/ci.yml .github/workflows/deploy-pages.yml .github/workflows/final-stabilization-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v1.15.1 finalize schema and recovery safety"
          git push
