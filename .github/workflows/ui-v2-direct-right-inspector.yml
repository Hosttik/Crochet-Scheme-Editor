name: UI v2 direct right inspector migration

on:
  push:
    branches:
      - feat/ui-v2-workbench-foundation
    paths:
      - .github/workflows/ui-v2-direct-right-inspector.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/ui-v2-workbench-foundation
          fetch-depth: 0
      - name: Apply direct right inspector migration
        run: python scripts/migrate_ui_v2_direct_right_inspector.py
      - name: Remove one-shot migration files
        run: |
          rm scripts/migrate_ui_v2_direct_right_inspector.py
          rm .github/workflows/ui-v2-direct-right-inspector.yml
      - name: Validate patch
        run: |
          git diff --check
          grep -q '<RightPanelTabs' src/App.tsx
          grep -q 'ui-v2-right-options-panel' src/App.tsx
          grep -q 'ui-v2-right-layers-panel' src/App.tsx
          ! grep -R 'RightInspectorBridge\|legacyRightInspectorAdapter\|rightInspectorBridge.css' src e2e
          ! test -e src/ui/RightInspectorBridge.tsx
          ! test -e src/ui/legacyRightInspectorAdapter.ts
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Render right inspector directly from App"
          git push origin HEAD:feat/ui-v2-workbench-foundation
