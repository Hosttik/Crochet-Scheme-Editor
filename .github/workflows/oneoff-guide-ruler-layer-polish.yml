name: One-off guide and ruler layer polish

on:
  push:
    branches:
      - ui/guide-angle-and-ruler-layer-actions

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/guide-angle-and-ruler-layer-actions
      - name: Patch ruler layer chrome
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          panel = Path('src/editor/LayersPanel.tsx')
          text = panel.read_text()
          old = '''        <IconButton
          className="layer-icon-button"
          icon={visible ? 'eye' : 'eyeOff'}
          label={visible ? t.hideLayer : t.showLayer}
          onClick={() => onToggleRulerVisible?.(ruler.id)}
        />
        <IconButton
          className="layer-icon-button"
          icon={locked ? 'lock' : 'unlock'}
          label={locked ? t.unlockLayer : t.lockLayer}
          onClick={() => onToggleRulerLocked?.(ruler.id)}
        />
        <button
          className="layer-main-button ruler-layer-main"
          title={label}
          aria-label={label}
          aria-pressed={active}
          onClick={() => onSelectRuler?.(ruler.id)}
        >
          <span className="ruler-layer-preview" aria-hidden="true">
            <EditorIcon name="ruler" size={18} />
          </span>
          <span>
            <strong>{label}</strong>
            <small>#{index + 1}{locked ? ` · ${locale === 'ru' ? 'заблокирована' : 'locked'}` : ''}</small>
          </span>
        </button>
        <IconButton
          className="layer-icon-button ruler-layer-delete"
          icon="trash"
          label={copy.deleteRuler}
          disabled={locked}
          data-testid={`ruler-layer-delete-${ruler.id}`}
          onClick={() => onDeleteRuler?.(ruler.id)}
        />'''
          new = '''        <button
          className="layer-main-button ruler-layer-main"
          title={label}
          aria-label={label}
          aria-pressed={active}
          onClick={() => onSelectRuler?.(ruler.id)}
        >
          <span className="ruler-layer-preview" aria-hidden="true">
            <EditorIcon name="ruler" size={18} />
          </span>
          <span>
            <strong>{label}</strong>
            <small>#{index + 1}{locked ? ` · ${locale === 'ru' ? 'заблокирована' : 'locked'}` : ''}</small>
          </span>
        </button>
        <div
          className="ruler-layer-actions"
          aria-label={`${label} · ${locale === 'ru' ? 'Управление' : 'Controls'}`}
        >
          <IconButton
            className="layer-icon-button"
            icon={visible ? 'eye' : 'eyeOff'}
            label={visible ? t.hideLayer : t.showLayer}
            onClick={() => onToggleRulerVisible?.(ruler.id)}
          />
          <IconButton
            className="layer-icon-button"
            icon={locked ? 'lock' : 'unlock'}
            label={locked ? t.unlockLayer : t.lockLayer}
            onClick={() => onToggleRulerLocked?.(ruler.id)}
          />
          <IconButton
            className="layer-icon-button ruler-layer-delete"
            icon="trash"
            label={copy.deleteRuler}
            disabled={locked}
            data-testid={`ruler-layer-delete-${ruler.id}`}
            onClick={() => onDeleteRuler?.(ruler.id)}
          />
        </div>'''
          if old not in text:
              raise SystemExit('Expected ruler row markup not found')
          panel.write_text(text.replace(old, new, 1))

          css = Path('src/layers.css')
          text = css.read_text()
          old_grid = '''.ruler-layer-row {
  grid-template-columns: 28px 28px minmax(0, 1fr) 28px;
}'''
          new_grid = '''.ruler-layer-row {
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: stretch;
}

.ruler-layer-row .ruler-layer-main {
  min-height: 46px;
}

.ruler-layer-actions {
  display: grid;
  grid-template-columns: repeat(3, 28px);
  align-items: stretch;
  border-left: 1px solid var(--ui-border, #d9e0e8);
  background: var(--ui-surface-subtle, #f8fafc);
}

.ruler-layer-actions .layer-icon-button {
  width: 28px;
  height: 100%;
  min-height: 46px;
  border: 0;
  border-right: 1px solid var(--ui-border, #d9e0e8);
  border-radius: 0;
}

.ruler-layer-actions .layer-icon-button:last-child {
  border-right: 0;
}'''
          if old_grid not in text:
              raise SystemExit('Expected ruler grid CSS not found')
          text = text.replace(old_grid, new_grid, 1)
          old_delete = '''.layer-row .ruler-layer-delete {
  border-right: 0;
  border-left: 1px solid var(--ui-border, #d9e0e8);
  color: var(--ui-danger, #d92d20);
}'''
          new_delete = '''.layer-row .ruler-layer-delete {
  color: var(--ui-danger, #d92d20);
}'''
          if old_delete not in text:
              raise SystemExit('Expected ruler delete CSS not found')
          css.write_text(text.replace(old_delete, new_delete, 1))

          pkg = Path('package.json')
          data = json.loads(pkg.read_text())
          data['version'] = '1.26.14'
          pkg.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Commit polish and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editor/LayersPanel.tsx src/layers.css package.json
          git rm .github/workflows/oneoff-guide-ruler-layer-polish.yml
          git commit -m "Polish guide labels and ruler layer controls"
          git push origin HEAD:ui/guide-angle-and-ruler-layer-actions
