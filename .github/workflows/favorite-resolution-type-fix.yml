name: Fix favorite resolver type import

on:
  push:
    branches:
      - refactor/ui-v2-favorite-resolution

permissions:
  contents: write

jobs:
  patch-type-import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/ui-v2-favorite-resolution
      - name: Import shared resolved favorite type
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'src/ui/ElementLibrary.tsx'
          let source = fs.readFileSync(path, 'utf8')
          const needle = `  symbolFavoriteKey,\n  type FavoriteElementKey,\n} from './favorites'`
          const replacement = `  symbolFavoriteKey,\n  type FavoriteElementKey,\n  type ResolvedFavorite,\n} from './favorites'`
          const first = source.indexOf(needle)
          if (first < 0) throw new Error('Missing favorites import anchor')
          if (source.indexOf(needle, first + needle.length) >= 0) throw new Error('Ambiguous favorites import anchor')
          source = source.slice(0, first) + replacement + source.slice(first + needle.length)
          fs.writeFileSync(path, source)
          NODE
      - name: Commit type import
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ui/ElementLibrary.tsx
          git commit -m 'Import shared resolved favorite type'
          git push origin HEAD:refactor/ui-v2-favorite-resolution
