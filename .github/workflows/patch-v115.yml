name: Patch v1.15 Lasso

on:
  push:
    branches:
      - feature/lasso-selection-v115

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip patch-v115]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/lasso-selection-v115
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply integration patch
        run: python .github/scripts/patch_v115.py
      - name: Verify
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Remove one-shot files and commit
        run: |
          rm -f .github/scripts/patch_v115.py .github/workflows/patch-v115.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v1.15 Lasso Selection [skip patch-v115]"
          git push origin HEAD:feature/lasso-selection-v115
