name: Sync v1.26 lock metadata

on:
  push:
    branches:
      - fix/v1.26-hardening

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/v1.26-hardening
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Sync package metadata
        run: npm version 1.26.0 --no-git-tag-version --allow-same-version
      - name: Commit lock metadata if needed
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: sync v1.26 lock metadata"
          git push origin HEAD:fix/v1.26-hardening
