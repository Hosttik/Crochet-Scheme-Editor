name: Release v1.17.1 correction

on:
  push:
    branches:
      - release/v1.17.1

permissions:
  contents: write

jobs:
  correct-version:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Correct SemVer metadata and UI
        run: |
          npm version 1.17.1 --no-git-tag-version
          sed -i 's/v1\.17\.0/v1.17.1/g' src/i18n.ts
      - name: Build and unit verification
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Chromium gate
        run: npx playwright test --project=chromium
      - name: Commit verified correction
        run: |
          rm .github/workflows/release-v1.17.1-correction.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json src/i18n.ts .github/workflows/release-v1.17.1-correction.yml
          git commit -m 'Correct release version to v1.17.1'
          git push origin HEAD:release/v1.17.1
