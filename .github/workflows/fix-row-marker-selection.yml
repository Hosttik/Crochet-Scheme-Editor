name: Fix row marker selection

on:
  push:
    branches:
      - feature/pattern-authoring-v1120
    paths:
      - .github/workflows/fix-row-marker-selection.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/pattern-authoring-v1120
          fetch-depth: 0
      - name: Remove accidental row marker deselection
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/App.tsx')
          s = path.read_text()
          pattern = re.compile(
              r"(const handleSelectRowMarker = useCallback\(\(id: string\) => \{\s*"
              r"setSelectedRowMarkerId\(id\)\s*"
              r"clearElementSelection\(\)\s*"
              r"setSelectedGuideId\(null\)\s*)"
              r"setSelectedRowMarkerId\(null\)\s*"
              r"(setTool\(\{ type: 'select' \}\))"
          )
          s, count = pattern.subn(r"\1\2", s, count=1)
          if count != 1:
              raise RuntimeError(f'unexpected row marker selection match count: {count}')
          path.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-row-marker-selection.yml
          git add -A
          git commit -m "Fix row marker selection state"
          git push origin HEAD:feature/pattern-authoring-v1120
