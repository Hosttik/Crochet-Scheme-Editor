name: Fix row marker selection

on:
  push:
    branches:
      - feature/pattern-authoring-v1120
    paths:
      - .github/workflows/fix-row-marker-selection.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/pattern-authoring-v1120
          fetch-depth: 0
      - name: Remove accidental row marker deselection
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          s = path.read_text()
          old = '''  const handleSelectRowMarker = useCallback((id: string) => {
            setSelectedRowMarkerId(id)
            clearElementSelection()
            setSelectedGuideId(null)
            setSelectedRowMarkerId(null)
            setTool({ type: 'select' })
            setPreview(null)
            setSnapTarget(null)
          }, [clearElementSelection])'''
          new = '''  const handleSelectRowMarker = useCallback((id: string) => {
            setSelectedRowMarkerId(id)
            clearElementSelection()
            setSelectedGuideId(null)
            setTool({ type: 'select' })
            setPreview(null)
            setSnapTarget(null)
          }, [clearElementSelection])'''
          if s.count(old) != 1:
              raise RuntimeError(f'unexpected row marker selection block count: {s.count(old)}')
          path.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-row-marker-selection.yml
          git add -A
          git commit -m "Fix row marker selection state"
          git push origin HEAD:feature/pattern-authoring-v1120
