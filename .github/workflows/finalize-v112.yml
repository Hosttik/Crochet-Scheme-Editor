name: Finalize v1.12 tests and docs

on:
  push:
    branches:
      - feature/pattern-authoring-v1120
    paths:
      - .github/workflows/finalize-v112.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/pattern-authoring-v1120
          fetch-depth: 0
      - name: Patch stale E2E expectations and README
        run: |
          python - <<'PY'
          from pathlib import Path

          pattern = Path('e2e/patternAuthoring.e2e.ts')
          s = pattern.read_text()
          needle = "  await expect(guideEditor.locator('fieldset.guide-locked-fields')).toBeDisabled()\n"
          if s.count(needle) != 1:
              raise RuntimeError('unexpected guide fieldset assertion count')
          pattern.write_text(s.replace(needle, '', 1))

          productivity = Path('e2e/productivity.e2e.ts')
          s = productivity.read_text()
          if s.count('expect(project.schemaVersion).toBe(14)') != 2:
              raise RuntimeError('unexpected productivity schema assertion count')
          s = s.replace('expect(project.schemaVersion).toBe(14)', 'expect(project.schemaVersion).toBe(15)')
          s = s.replace("test('persists group ids in schema v14 and updates a renamed project immediately'", "test('persists group ids in schema v15 and updates a renamed project immediately'", 1)
          productivity.write_text(s)

          readme = Path('README.md')
          s = readme.read_text()
          s = s.replace('## v1.11.1', '## v1.12.0', 1)
          old_intro = "The editor combines an SVG canvas with a document model that understands guides, parametric rows, crochet row shaping, editable stitch-to-stitch topology, mixed/rich rapports and how each row is physically constructed. v1.11 adds continuous path guides and persistent manual stitch-to-guide attachment; v1.11.1 completes mirror authoring with an explicit draggable vertical/horizontal axis while keeping quick center-based Flip and Rotate 180° as separate operations."
          new_intro = "The editor combines an SVG canvas with a document model that understands guides, parametric rows, crochet row shaping, editable stitch-to-stitch topology, mixed/rich rapports and how each row is physically constructed. v1.11 adds continuous path guides and persistent manual stitch-to-guide attachment; v1.11.1 completes mirror authoring with a draggable custom axis; v1.12 adds guide locking, independent row-number annotations and an automatic exportable legend."
          if old_intro not in s:
              raise RuntimeError('README intro target missing')
          s = s.replace(old_intro, new_intro, 1)

          guide_anchor = "- Arc, Line, cubic Bezier Curve, Rectangular Grid and Radial Grid guides\n"
          guide_insert = guide_anchor + "- any guide can be locked against accidental move/resize/rotate/numeric edits while remaining selectable and unlockable\n"
          if guide_anchor not in s:
              raise RuntimeError('README guide anchor missing')
          s = s.replace(guide_anchor, guide_insert, 1)

          persistence_anchor = "### Persistence and export\n\n"
          persistence_intro = persistence_anchor + "- independent red-dot row-number annotations support automatic first-gap numbering, drag, manual numbering, visibility and lock\n- row-number annotations persist through autosave/JSON and are included in SVG export\n- automatic legend is derived from actually used visible stitch symbols, shows abbreviation plus localized RU/EN name, can be toggled, and is included in SVG export\n"
          if persistence_anchor not in s:
              raise RuntimeError('README persistence anchor missing')
          s = s.replace(persistence_anchor, persistence_intro, 1)

          s = s.replace('project JSON schema is v14; v1-v13 remain loadable through runtime validation/migration', 'project JSON schema is v15; v1-v14 remain loadable through runtime validation/migration', 1)
          schema14 = "- schema v14 adds Line/Curve guide persistence and optional manual `guideAttachment` metadata\n"
          schema15 = schema14 + "- schema v15 adds guide lock state, independent row-number annotations and legend visibility settings\n"
          if schema14 not in s:
              raise RuntimeError('README schema v14 anchor missing')
          s = s.replace(schema14, schema15, 1)

          old_next = "Next larger product milestones are crochet-native row-boundary semantics (counted turning/start chains, skipped first stitches and exact joined-round closure), row-number annotations/legend generation, and document output features such as image underlays, tiled printing and free-form lasso selection. A future color-domain milestone could turn visual colors into explicit yarn/color-change semantics, but only after defining row-boundary behavior clearly."
          new_next = "Next larger product milestones are crochet-native row-boundary semantics (counted turning/start chains, skipped first stitches and exact joined-round closure) and document output features such as configurable autosave, image underlays, tiled printing and free-form lasso selection. A future color-domain milestone could turn visual colors into explicit yarn/color-change semantics, but only after defining row-boundary behavior clearly."
          if old_next not in s:
              raise RuntimeError('README roadmap target missing')
          s = s.replace(old_next, new_next, 1)
          readme.write_text(s)
          PY
      - name: Commit final v1.12 fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/finalize-v112.yml
          git add -A
          git commit -m "Finalize v1.12 E2E and documentation"
          git push origin HEAD:feature/pattern-authoring-v1120
