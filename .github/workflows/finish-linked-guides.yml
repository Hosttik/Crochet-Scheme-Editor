name: Finish linked guides E2E migration

on:
  push:
    branches: [feature/linked-guides-v111]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/linked-guides-v111
      - name: Update legacy schema expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('e2e/productivity.e2e.ts')
          text = path.read_text()
          old = 'expect(project.schemaVersion).toBe(13)'
          if text.count(old) != 2:
              raise SystemExit(f'Expected 2 legacy schema assertions, found {text.count(old)}')
          text = text.replace(old, 'expect(project.schemaVersion).toBe(14)')
          text = text.replace(
              "test('persists group ids in schema v13 and updates a renamed project immediately'",
              "test('persists group ids in schema v14 and updates a renamed project immediately'",
          )
          path.write_text(text)
          PY
      - name: Remove one-shot workflow
        run: git rm .github/workflows/finish-linked-guides.yml
      - name: Commit final E2E migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/productivity.e2e.ts
          git commit -m 'Finish v1.11 E2E schema migration'
          git push origin HEAD:feature/linked-guides-v111
