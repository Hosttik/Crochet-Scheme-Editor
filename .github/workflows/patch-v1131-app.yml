name: Patch v1.13.1 app integration

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/v1131-stabilization' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/v1131-stabilization
      - name: Patch App handlers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text()

          def replace_once(old: str, new: str):
              global text
              if old not in text:
                  raise SystemExit(f'Expected App snippet missing: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              "import { isRowMarkerLocked, nextRowMarkerNumber, normalizedRowMarkerNumber } from './editor/rowMarkers'",
              "import { deleteRowMarkerAndRenumber, isRowMarkerLocked, nextRowMarkerNumber, normalizedRowMarkerNumber } from './editor/rowMarkers'",
          )

          replace_once(
              "  const autosaveRevisionRef = useRef(0)\n",
              "  const autosaveRevisionRef = useRef(0)\n  const autosaveSettingsWriteRef = useRef<AutosaveDelayMs | null>(null)\n",
          )

          replace_once(
              "  useEffect(() => {\n    if (!hydrated) return\n    if (autosaveDelayMs === 0) {\n",
              "  useEffect(() => {\n    if (!hydrated) return\n    if (autosaveSettingsWriteRef.current === autosaveDelayMs) {\n      autosaveSettingsWriteRef.current = null\n      return\n    }\n    if (autosaveDelayMs === 0) {\n",
          )

          replace_once(
              "      commitRowMarkers(rowMarkers.filter((item) => item.id !== selectedRowMarkerId))\n",
              "      commitRowMarkers(deleteRowMarkerAndRenumber(rowMarkers, selectedRowMarkerId))\n",
          )

          replace_once(
              "    if (selectedGuideId) {\n      commitGuides(guides.filter((guide) => guide.id !== selectedGuideId))\n      setSelectedGuideId(null)\n      setStatus(t.guideDeleted)\n    }\n",
              "    if (selectedGuideId) {\n      const guide = guides.find((item) => item.id === selectedGuideId)\n      if (!guide || guide.locked === true) return\n      commitGuides(guides.filter((item) => item.id !== selectedGuideId))\n      setSelectedGuideId(null)\n      setStatus(t.guideDeleted)\n    }\n",
          )

          replace_once(
              "    commitRowMarkers(rowMarkers.filter((item) => item.id !== id))\n",
              "    commitRowMarkers(deleteRowMarkerAndRenumber(rowMarkers, id))\n",
          )

          replace_once(
              """  const handleAutosaveDelayChange = (delayMs: AutosaveDelayMs) => {\n    setAutosaveDelayMs(delayMs)\n    if (delayMs !== 0) return\n\n    const project = buildProject(projectTitle, elements, guides, snapping, rowMarkers, legendVisible, delayMs)\n    const task = autosaveQueueRef.current\n      .catch(() => undefined)\n      .then(() => saveLocalProject(activeProjectId, project))\n    autosaveQueueRef.current = task\n    void task.catch(() => setAutosaveState('error'))\n  }\n""",
              """  const handleAutosaveDelayChange = (delayMs: AutosaveDelayMs) => {\n    autosaveSettingsWriteRef.current = delayMs\n    const revision = ++autosaveRevisionRef.current\n    setAutosaveDelayMs(delayMs)\n    setAutosaveState(delayMs === 0 ? 'off' : 'saving')\n\n    // Persist the selected interval immediately. Otherwise choosing 60 s and\n    // reloading before the first timer fires silently restores the old setting.\n    const project = buildProject(projectTitle, elements, guides, snapping, rowMarkers, legendVisible, delayMs)\n    const task = autosaveQueueRef.current\n      .catch(() => undefined)\n      .then(() => saveLocalProject(activeProjectId, project))\n    autosaveQueueRef.current = task\n    void task\n      .then(() => {\n        if (autosaveRevisionRef.current === revision) {\n          setAutosaveState(delayMs === 0 ? 'off' : 'saved')\n        }\n      })\n      .catch(() => {\n        if (autosaveRevisionRef.current === revision) setAutosaveState('error')\n      })\n  }\n""",
          )

          replace_once(
              """              {(selectedGuide.type === 'arc' || selectedGuide.type === 'radial-grid') && (\n                <GuideRowGeneratorPanel\n                  guide={selectedGuide}\n                  locale={locale}\n                  onGenerate={handleGenerateGuideRow}\n                />\n              )}\n\n              </fieldset>\n\n              <p className=\"guide-note\">{t.guideNote}</p>\n              <button className=\"danger-button\" onClick={deleteSelected}>{t.deleteGuide}</button>\n""",
              """              </fieldset>\n\n              {(selectedGuide.type === 'arc' || selectedGuide.type === 'radial-grid') && (\n                <GuideRowGeneratorPanel\n                  guide={selectedGuide}\n                  locale={locale}\n                  onGenerate={handleGenerateGuideRow}\n                />\n              )}\n\n              <p className=\"guide-note\">{t.guideNote}</p>\n              <button className=\"danger-button\" disabled={selectedGuide.locked === true} onClick={deleteSelected}>{t.deleteGuide}</button>\n""",
          )

          path.write_text(text)
          PY

          rm -f .github/workflows/stabilize-v1131.yml .github/workflows/patch-v1131-app.yml

      - name: Commit App integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate v1.13.1 stabilization handlers"
          git push origin HEAD:fix/v1131-stabilization
