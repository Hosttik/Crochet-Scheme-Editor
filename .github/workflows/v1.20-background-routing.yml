name: Verify v1.20 background routing

on:
  push:
    branches:
      - feature/v1.20-background-print

permissions:
  contents: write

jobs:
  verify-and-materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.20-background-print
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply routing fix
        run: python scripts/fix_v1_20_background_routing.py
      - name: Install dependencies
        run: npm ci
      - name: Build and unit verification
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Full Chromium gate
        run: npm run test:e2e
      - name: Commit verified routing fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v1.20-background-routing.yml scripts/fix_v1_20_background_routing.py
          git add -A
          git commit -m "Keep tracing tools above background underlay"
          git push origin HEAD:feature/v1.20-background-print
