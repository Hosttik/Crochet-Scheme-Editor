name: v1.24 E2E contract refresh

on:
  push:
    branches:
      - feat/v1.24-parametric-stitch-editing

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/v1.24-parametric-stitch-editing
          fetch-depth: 0
      - name: Refresh stale schema expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in Path('e2e').glob('*.ts'):
              text = path.read_text()
              updated = text.replace('schemaVersion).toBe(21)', 'schemaVersion).toBe(22)')
              if updated != text:
                  path.write_text(updated)
          workflow = Path('.github/workflows/v124-e2e-contract-refresh.yml')
          if workflow.exists():
              workflow.unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Refresh v1.24 browser schema contracts"
          git push origin HEAD:feat/v1.24-parametric-stitch-editing
