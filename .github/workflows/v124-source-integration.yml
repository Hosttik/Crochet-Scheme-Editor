name: v1.24 source integration

on:
  push:
    branches:
      - feat/v1.24-parametric-stitch-editing

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/v1.24-parametric-stitch-editing
          fetch-depth: 0
      - name: Patch App integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "import { solveSnap, type SnapCandidate } from './editor/snapping'\n",
              "import { solveSnap, type SnapCandidate } from './editor/snapping'\nimport { resolvedStitchGeometry } from './editor/stitchGeometry'\n",
              'geometry import',
          )
          replace_once(
              "  idsInLasso,\n",
              "  elementAabb,\n  idsInLasso,\n",
              'elementAabb import',
          )
          replace_once(
              """  const bounds = elements.map((element) => {\n    const definition = SYMBOL_BY_ID.get(element.symbolId)\n    const half = Math.max(definition?.width ?? 30, definition?.height ?? 30) / 2 + 12\n    return { left: element.x - half, right: element.x + half, top: element.y - half, bottom: element.y + half }\n  })\n""",
              """  const bounds = elements.map((element) =>\n    elementAabb(element, SYMBOL_SIZES[element.symbolId] ?? { width: 30, height: 30 }, 12),\n  )\n""",
              'export bounds',
          )
          replace_once(
              """  const content = elements\n    .map((element) => `<g transform=\"translate(${element.x} ${element.y}) rotate(${element.rotation})${element.mirrored ? ' scale(-1 1)' : ''}\" style=\"color:${element.color ?? DEFAULT_STITCH_COLOR}\">${symbolSvgMarkup(element.symbolId)}</g>`)\n    .join('')\n""",
              """  const content = elements\n    .map((element) => {\n      const geometry = resolvedStitchGeometry(element)\n      const scaleX = (element.mirrored ? -1 : 1) * geometry.scaleX\n      return `<g transform=\"translate(${element.x} ${element.y}) rotate(${element.rotation}) scale(${scaleX} ${geometry.scaleY})\" style=\"color:${element.color ?? DEFAULT_STITCH_COLOR}\">${symbolSvgMarkup(element.symbolId, geometry.spread)}</g>`\n    })\n    .join('')\n""",
              'export glyph geometry',
          )
          replace_once(
              """              onElementPointerDown={handleElementPointerDown}\n              onRotatePointerDown={handleRotatePointerDown}\n              onTopologyMarkerPointerDown={handleTopologyMarkerPointerDown}\n""",
              """              onElementPointerDown={handleElementPointerDown}\n              onRotatePointerDown={handleRotatePointerDown}\n              onGeometryCommit={(elementId, geometry) => {\n                const target = elements.find((element) => element.id === elementId)\n                if (!target || target.parametricRow || isElementLocked(target)) return\n                duplicateSeriesRef.current = null\n                commitElements(elements.map((element) =>\n                  element.id === elementId ? { ...element, geometry } : element,\n                ))\n                setSelectedIds([elementId])\n                setStatus(locale === 'ru' ? 'Размер элемента изменён' : 'Stitch geometry changed')\n              }}\n              onTopologyMarkerPointerDown={handleTopologyMarkerPointerDown}\n""",
              'StitchLayer geometry commit',
          )

          path.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Integrate v1.24 stitch geometry into App"
          git push origin HEAD:feat/v1.24-parametric-stitch-editing
