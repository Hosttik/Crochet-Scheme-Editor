name: Apply stabilization patch

on:
  push:
    branches: [stabilization/v1.15.1-data-integrity]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: stabilization/v1.15.1-data-integrity
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Apply stabilization patch
        run: |
          python scripts/apply_stabilization_patch.py
          python scripts/apply_stabilization_fix2.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify typecheck, unit tests and build
        run: npm run build
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v1.15.1 data integrity stabilization"
          git push
