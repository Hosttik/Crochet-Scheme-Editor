name: Patch schema v16 E2E expectations

on:
  push:
    branches:
      - feature/row-boundaries-v113
    paths:
      - .github/workflows/patch-v16-e2e.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/row-boundaries-v113
          fetch-depth: 0
      - name: Update current schema assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          changes = {
              'e2e/linkedGuides.e2e.ts': [('toBe(15)', 'toBe(16)', 1)],
              'e2e/patternAuthoring.e2e.ts': [
                  ('schema v15', 'schema v16', 1),
                  ('toBe(15)', 'toBe(16)', 1),
              ],
              'e2e/productivity.e2e.ts': [
                  ('toBe(15)', 'toBe(16)', 2),
                  ('schema v15', 'schema v16', 1),
              ],
          }
          for path, replacements in changes.items():
              p = Path(path)
              text = p.read_text()
              for old, new, expected in replacements:
                  actual = text.count(old)
                  if actual != expected:
                      raise RuntimeError(f'{path}: {old!r} expected {expected}, got {actual}')
                  text = text.replace(old, new)
              p.write_text(text)
          PY
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/patch-v16-e2e.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update E2E schema expectations to v16"
          git push origin HEAD:feature/row-boundaries-v113
