name: Apply gauge smart ruler

on:
  push:
    branches:
      - feature/v1.17-gauge-smart-ruler
    paths:
      - .github/workflows/apply-gauge-feature.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/v1.17-gauge-smart-ruler
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply gauge and smart ruler feature
        run: |
          python3 scripts/apply_gauge_feature.py
          sed -i "s/import { STITCH_SYMBOLS, SYMBOL_BY_ID } from '..\/symbols'/import { STITCH_SYMBOLS } from '..\/symbols'/" src/editor/GaugeRulerPanel.tsx
          python3 scripts/fix_gauge_feature.py

      - name: Verify TypeScript and production build
        run: npm run build

      - name: Commit feature implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Add gauge calibration and smart rulers"
          git push origin HEAD:feature/v1.17-gauge-smart-ruler
