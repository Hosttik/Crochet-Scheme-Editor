name: UI v2 App workbench migration

on:
  push:
    branches:
      - feat/ui-v2-workbench-foundation
    paths:
      - scripts/migrate_ui_v2_app_workbench.py
      - .github/workflows/ui-v2-migrate-app.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/ui-v2-workbench-foundation
          fetch-depth: 0
      - name: Apply migration
        run: python scripts/migrate_ui_v2_app_workbench.py
      - name: Validate patch
        run: git diff --check
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/main.tsx e2e/uiV2LeftWorkbench.e2e.ts
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git commit -m "Connect App-owned workbench commands"
          git push origin HEAD:feat/ui-v2-workbench-foundation
