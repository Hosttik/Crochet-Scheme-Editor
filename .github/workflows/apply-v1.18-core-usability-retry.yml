name: Apply v1.18 core usability retry

on:
  push:
    branches:
      - feature/v1.18-core-usability

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply corrected core usability changes
        run: |
          sed -i "s#'src/productivity.css'#'src/editor/productivity.css'#" scripts/apply_v1_18_core_usability.py
          python scripts/apply_v1_18_core_usability.py
          npm version 1.18.0 --no-git-tag-version
          sed -i 's/v1\.17\.1/v1.18.0/g' src/i18n.ts
      - name: Build and unit verification
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Full Chromium usability gate
        run: npx playwright test --project=chromium
      - name: Commit verified product changes
        run: |
          rm .github/workflows/apply-v1.18-core-usability.yml
          rm .github/workflows/apply-v1.18-core-usability-retry.yml
          rm scripts/apply_v1_18_core_usability.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Improve core editor usability for v1.18.0'
          git push origin HEAD:feature/v1.18-core-usability
