name: Apply parametric v0.8 integration

on:
  push:
    branches: [feature/parametric-rows-v08]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/parametric-rows-v08
      - name: Apply guarded integration patch
        run: node scripts/apply-parametric-v08.mjs
      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No integration changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/i18n.ts package.json
          git commit -m "Integrate parametric rows into editor"
          git push origin HEAD:feature/parametric-rows-v08
