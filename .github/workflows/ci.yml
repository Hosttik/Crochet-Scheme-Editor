name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-stitch-topology-v13:
    if: github.head_ref == 'feature/stitch-topology-v13' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: feature/stitch-topology-v13
      - name: Apply guarded integration patch
        run: node scripts/apply-stitch-topology-v13.mjs
      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No integration changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/editor/parametricRows.ts src/i18n.ts
          git commit -m "Integrate stitch topology v1.3"
          git push origin HEAD:feature/stitch-topology-v13

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck, test and build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build preview
        run: npx vite build
      - name: Run Playwright E2E
        run: npm run test:e2e

  smoke-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Verify published GitHub Pages site
        run: |
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 5 --retry-all-errors \
            https://hosttik.github.io/Crochet-Scheme-Editor/ \
            --output /dev/null
