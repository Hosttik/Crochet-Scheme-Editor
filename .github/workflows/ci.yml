name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-editor-foundation-v12:
    if: github.head_ref == 'feature/editor-foundation-v12' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: feature/editor-foundation-v12
      - name: Apply guarded integration patches
        run: |
          node scripts/apply-editor-foundation-v12.mjs
          node scripts/finalize-editor-foundation-v12.mjs
      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No integration changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/i18n.ts
          git commit -m "Finalize editor foundation integration"
          git push origin HEAD:feature/editor-foundation-v12

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck, test and build
        run: npm run build

  smoke-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Verify published GitHub Pages site
        run: |
          curl --fail --silent --show-error --location \
            --retry 12 --retry-delay 5 --retry-all-errors \
            https://hosttik.github.io/Crochet-Scheme-Editor/ \
            --output /dev/null
