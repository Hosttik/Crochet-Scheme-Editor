name: Apply row height ruler

on:
  push:
    branches:
      - feature/v1.17.1-row-height-ruler
    paths:
      - .github/workflows/apply-row-height-ruler.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout follow-up branch
        uses: actions/checkout@v6
        with:
          ref: feature/v1.17.1-row-height-ruler
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply row-height ruler follow-up
        run: |
          python3 scripts/apply_row_height_ruler.py
          python3 scripts/fix_row_height_ruler_e2e.py

      - name: Verify typecheck, unit tests and build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run Chromium E2E
        run: npm run test:e2e

      - name: Commit verified follow-up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src e2e
          git commit -m "Add row-height smart ruler mode"
          git push origin HEAD:feature/v1.17.1-row-height-ruler

# One-shot verification workflow; remove after the follow-up commit is green.
