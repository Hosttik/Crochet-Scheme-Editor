name: One-off ruler selection fix

on:
  push:
    branches:
      - feat/ruler-layers-management

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/ruler-layers-management
      - name: Patch canvas ruler deselection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text()

          lasso_old = """    if (tool.type === 'lasso') {\n      event.currentTarget.setPointerCapture(event.pointerId)\n      setSelectedGuideId(null)\n      setSelectedRowMarkerId(null)\n      setLasso({\n"""
          lasso_new = """    if (tool.type === 'lasso') {\n      event.currentTarget.setPointerCapture(event.pointerId)\n      setSelectedGuideId(null)\n      setSelectedRowMarkerId(null)\n      setSelectedRulerId(null)\n      setLasso({\n"""
          marquee_old = """    event.currentTarget.setPointerCapture(event.pointerId)\n    setSelectedGuideId(null)\n    setSelectedRowMarkerId(null)\n    setMarquee({\n"""
          marquee_new = """    event.currentTarget.setPointerCapture(event.pointerId)\n    setSelectedGuideId(null)\n    setSelectedRowMarkerId(null)\n    setSelectedRulerId(null)\n    setMarquee({\n"""

          if lasso_old not in text:
              raise SystemExit('Expected lasso selection block was not found')
          if marquee_old not in text:
              raise SystemExit('Expected marquee selection block was not found')

          text = text.replace(lasso_old, lasso_new, 1)
          text = text.replace(marquee_old, marquee_new, 1)
          path.write_text(text)
          PY
      - name: Commit fix and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git rm .github/workflows/oneoff-ruler-selection-fix.yml
          git commit -m "Fix ruler deselection on canvas"
          git push origin HEAD:feat/ruler-layers-management
