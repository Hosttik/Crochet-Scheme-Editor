name: Apply v1.18 core usability final

on:
  push:
    branches:
      - feature/v1.18-core-usability

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply core usability changes and Hand routing fix
        run: |
          sed -i "s#'src/productivity.css'#'src/editor/productivity.css'#" scripts/apply_v1_18_core_usability.py
          python scripts/apply_v1_18_core_usability.py
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text()
          old = """  const handleCanvasPointerDown = (event: ReactPointerEvent<SVGSVGElement>) => {
    if (event.button === 1 || spacePressedRef.current || tool.type === 'pan') {
"""
          new = """  const handleCanvasPointerDownCapture = (event: ReactPointerEvent<SVGSVGElement>) => {
    if (tool.type !== 'pan' || event.button !== 0) return
    event.preventDefault()
    event.stopPropagation()
    beginPan(event)
  }

  const handleCanvasPointerDown = (event: ReactPointerEvent<SVGSVGElement>) => {
    if (event.button === 1 || spacePressedRef.current) {
"""
          if text.count(old) != 1:
              raise SystemExit(f'Hand handler source mismatch: {text.count(old)}')
          text = text.replace(old, new, 1)
          old_prop = """          onPointerDown={handleCanvasPointerDown}
"""
          new_prop = """          onPointerDownCapture={handleCanvasPointerDownCapture}
          onPointerDown={handleCanvasPointerDown}
"""
          if text.count(old_prop) != 1:
              raise SystemExit(f'SVG pointer prop mismatch: {text.count(old_prop)}')
          app.write_text(text.replace(old_prop, new_prop, 1))

          css = Path('src/editor/productivity.css')
          text = css.read_text()
          malformed = """.productivity-actions,
.productivity-mode-tabs,
.productivity-field-error { display: block; margin-top: -5px; color: #a44036; font-size: 10px; }
.productivity-field-grid {"""
          corrected = """.productivity-actions,
.productivity-mode-tabs,
.productivity-field-grid {"""
          if text.count(malformed) != 1:
              raise SystemExit(f'Productivity CSS source mismatch: {text.count(malformed)}')
          text = text.replace(malformed, corrected, 1)
          text += "\n.productivity-field-error { display: block; margin-top: -5px; color: #a44036; font-size: 10px; }\n"
          css.write_text(text)
          PY
          npm version 1.18.0 --no-git-tag-version
          sed -i 's/v1\.17\.1/v1.18.0/g' src/i18n.ts
      - name: Build and unit verification
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Full Chromium usability gate
        run: npx playwright test --project=chromium
      - name: Commit verified product changes
        run: |
          rm -f .github/workflows/apply-v1.18-core-usability.yml
          rm -f .github/workflows/apply-v1.18-core-usability-retry.yml
          rm -f .github/workflows/apply-v1.18-core-usability-final.yml
          rm -f scripts/apply_v1_18_core_usability.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Improve core editor usability for v1.18.0'
          git push origin HEAD:feature/v1.18-core-usability
